[package]
name = "cordial-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Local agentic harness for Cordial: prompt assembly, tool loop, permissions, model management."

[features]
# Experimental and deliberately not connected to the agent until sandbox and
# distribution tests pass on all supported platforms.
sandbox-python = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
cordial-llama = { path = "../cordial-llama" }
anyhow.workspace = true
base64.workspace = true
dirs.workspace = true
futures-util.workspace = true
quick-xml = "0.42"
regex = "1"
shlex = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
reqwest.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
wasmtime = { version = "=36.0.19", default-features = false, features = ["cranelift", "runtime", "std"], optional = true }
wasmtime-wasi = { version = "=36.0.19", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
