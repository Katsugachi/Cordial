name: Format

# Applies `cargo fmt` and commits the result. Contributors can just push; this
# keeps the tree formatted without requiring a local rustfmt of the exact
# toolchain version. Commits made with the workflow token do not re-trigger CI.
# Push and dispatch events require repository write access; fork PRs never run here.
on:
  push:
    branches-ignore: ["main"]
    paths: ["**/*.rs"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    runs-on: instabox-medium
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Keep Cargo.lock in the repository
        run: cargo generate-lockfile
      - name: Commit if the tree changed
        run: |
          if git diff --quiet && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "Already formatted and locked."
            exit 0
          fi
          git config user.name "cordial-format"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git add Cargo.lock
          git commit -m "style: cargo fmt and refresh Cargo.lock"
          git push
