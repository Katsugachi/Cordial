name: Format

# Applies `cargo fmt` and commits the result. Contributors can just push; this
# keeps the tree formatted without requiring a local rustfmt of the exact
# toolchain version. Commits made with the workflow token do not re-trigger CI.
on:
  push:
    branches-ignore: ["main"]
    paths: ["**/*.rs"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit if the tree changed
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "cordial-format"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style: cargo fmt"
          git push
