name: Release

# Builds installers for every supported target. Triggered by a version tag or by
# hand, so a release can be rehearsed without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-14
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            artifact: cordial-macos-arm64
            opencl: "0"
          - label: macOS x64
            os: macos-13
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            artifact: cordial-macos-x64
            opencl: "0"
          - label: Windows x64
            os: windows-2022
            rust_target: ""
            args: ""
            artifact: cordial-windows-x64
            opencl: "0"
          - label: Windows arm64 (OpenCL)
            os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc
            artifact: cordial-windows-arm64
            opencl: "1"
          - label: Linux x64
            os: ubuntu-22.04
            rust_target: ""
            args: ""
            artifact: cordial-linux-x64
            opencl: "0"
          - label: Linux arm64
            os: ubuntu-24.04-arm
            rust_target: ""
            args: ""
            artifact: cordial-linux-arm64
            opencl: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm --prefix ui ci

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Distributable CPU build: no -march=native, so the binary runs on any
          # machine of the same architecture.
          CORDIAL_PORTABLE_CPU: "1"
          # Windows ARM64 has no first-class GPU compute path in llama.cpp; the
          # build script picks OpenCL there, and this flag makes it explicit.
          CORDIAL_GGML_OPENCL: ${{ matrix.opencl }}
        with:
          projectPath: crates/cordial-app
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Cordial {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      - name: Collect bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            crates/cordial-app/target/**/release/bundle/dmg/*.dmg
            crates/cordial-app/target/**/release/bundle/macos/*.app
            crates/cordial-app/target/**/release/bundle/msi/*.msi
            crates/cordial-app/target/**/release/bundle/nsis/*.exe
            crates/cordial-app/target/**/release/bundle/deb/*.deb
            crates/cordial-app/target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage

  smoke:
    name: Behavioural smoke test (real model)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the prompt suite against LFM3-VL-2B
        run: scripts/ci/report.sh cargo test -p cordial-core --test live_model -- --ignored --nocapture
