name: Release

# Builds installers for every supported target. A manual run can rehearse the
# builds without publishing, or publish a verified prerelease with an explicit
# preview number (never the workflow run count).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      preview_number:
        description: "Preview number (for example, 10)"
        required: true
        default: "10"
        type: string
      publish:
        description: "Publish the verified installers as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.preview_number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            artifact: cordial-macos-arm64
            opencl: "0"
          - label: macOS x64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            artifact: cordial-macos-x64
            opencl: "0"
          - label: Windows x64
            os: windows-2022
            rust_target: ""
            args: ""
            artifact: cordial-windows-x64
            opencl: "0"
          - label: Windows arm64 (OpenCL)
            os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc
            artifact: cordial-windows-arm64
            opencl: "1"
          - label: Linux x64
            os: ubuntu-22.04
            rust_target: ""
            args: ""
            artifact: cordial-linux-x64
            opencl: "0"
          - label: Linux arm64
            os: ubuntu-24.04-arm
            rust_target: ""
            args: ""
            artifact: cordial-linux-arm64
            opencl: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm --prefix ui ci

      - name: Build and bundle
        shell: bash
        env:
          CORDIAL_PORTABLE_CPU: "1"
          CORDIAL_GGML_OPENCL: ${{ matrix.opencl }}
        run: |
          scripts/ci/report.sh bash -c 'cd crates/cordial-app && ../../ui/node_modules/.bin/tauri build ${{ matrix.args }}'

      - name: Collect bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            crates/cordial-app/target/**/release/bundle/dmg/*.dmg
            crates/cordial-app/target/**/release/bundle/msi/*.msi
            crates/cordial-app/target/**/release/bundle/nsis/*.exe
            crates/cordial-app/target/**/release/bundle/deb/*.deb
            crates/cordial-app/target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage

  validation:
    name: UI and core tests
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix ui ci
      - run: npm --prefix ui run test
      - run: npm --prefix ui run typecheck
      - name: Core unit and agent tests
        run: scripts/ci/report.sh cargo test -p cordial-core --lib --test agent_flow

  smoke:
    name: Behavioural smoke test (real model)
    needs: [build, validation]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the prompt suite against LFM3-VL-2B
        env:
          CORDIAL_MODEL_DIR: ${{ runner.temp }}/cordial-models
          RUST_TEST_THREADS: "1"
        run: scripts/ci/report.sh cargo test -p cordial-core --test live_model -- --ignored --nocapture

  publish-release:
    name: Publish verified preview installers
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type == 'branch') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.1.0-preview-'))
    needs: [build, validation, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cordial-*
          path: bundles
      - name: Create and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_NUMBER: ${{ inputs.preview_number || github.ref_name }}
          RELEASE_TAG_INPUT: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PREVIEW_NUMBER" == v0.1.0-preview-* ]]; then
            PREVIEW_NUMBER="${PREVIEW_NUMBER#v0.1.0-preview-}"
          fi
          [[ "$PREVIEW_NUMBER" =~ ^[1-9][0-9]*$ ]]
          RELEASE_TAG="v0.1.0-preview-$PREVIEW_NUMBER"
          NOTES_FILE="docs/releases/preview-$PREVIEW_NUMBER.md"
          test -f "$NOTES_FILE"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          tag_args=(--target "$RELEASE_COMMIT")
          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if test -n "$remote_tag" || [[ "$RELEASE_TAG_INPUT" == "$RELEASE_TAG" ]]; then
            # A version-tag run publishes the exact tag that triggered it.
            test "$RELEASE_TAG_INPUT" = "$RELEASE_TAG"
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
            tag_args=(--verify-tag)
          fi

          mapfile -d '' files < <(find bundles -type f -print0 | sort -z)
          # Two DMGs, two MSI/NSIS pairs, and two DEB/AppImage pairs.
          test "${#files[@]}" -eq 10
          for platform in macos-arm64 macos-x64 windows-x64 windows-arm64 linux-x64 linux-arm64; do
            test -d "bundles/cordial-$platform"
          done
          for file in "${files[@]}"; do
            case "$file" in
              *.dmg|*.msi|*.exe|*.deb|*.AppImage) ;;
              *) echo "Unexpected release asset: $file" >&2; exit 1 ;;
            esac
          done
          mapfile -d '' unique_names < <(find bundles -type f -printf '%f\0' | sort -zu)
          test "${#unique_names[@]}" -eq "${#files[@]}"

          mkdir release-assets
          cp -- "${files[@]}" release-assets/
          (cd release-assets && sha256sum -- * > ../SHA256SUMS.txt)
          {
            cat "$NOTES_FILE"
            printf '\n---\nBuilt from commit `%s`. [Build and verification run](%s).\n' "$RELEASE_COMMIT" "$RUN_URL"
          } > release-notes.md
          gh release create "$RELEASE_TAG" release-assets/* SHA256SUMS.txt \
            "${tag_args[@]}" --prerelease --latest=false \
            --title "Preview Release $PREVIEW_NUMBER" --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --json tagName,name,isDraft,isPrerelease,assets \
            --jq '{tag: .tagName, name: .name, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name]}'
