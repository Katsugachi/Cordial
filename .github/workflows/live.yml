name: Live model

# Behavioural suite against the real LFM3-VL-2B weights. Slow (downloads 1.3 GB
# and runs CPU inference), so it is manual and on a weekly schedule rather than
# on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: live-model
  cancel-in-progress: false

jobs:
  behaviour:
    name: Prompts against LFM3-VL-2B
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CORDIAL_PORTABLE_CPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cordial-rust
          cache-on-failure: true
      - name: Cache the weights
        uses: actions/cache@v4
        with:
          path: ~/.cordial-models
          key: lfm3-vl-2b-q4km-mmproj-q8
      - name: Run the suite
        env:
          CORDIAL_MODEL_DIR: ~/.cordial-models
        run: scripts/ci/report.sh cargo test -p cordial-core --test live_model -- --ignored --nocapture --test-threads=1
