name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # Pinned llama.cpp release (LFM3-VL support requires >= b11960).
  LLAMA_CPP_TAG: b12020

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  formatting:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: scripts/ci/report.sh cargo fmt --all -- --check

  rust:
    name: Rust (clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Standard private-repo runners have two cores; keep both cargo and the
      # llama.cpp build from fighting over memory.
      CARGO_BUILD_JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cordial-rust
          cache-on-failure: true
      - name: Clippy (harness)
        run: scripts/ci/report.sh cargo clippy --workspace --exclude cordial-app --all-targets -- -D warnings
      - name: Tests (harness)
        run: scripts/ci/report.sh cargo test --workspace --exclude cordial-app --all-targets

  app:
    name: Desktop shell (compile check)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cordial-app
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the frontend
        run: npm --prefix ui ci && npm --prefix ui run build
      - name: Compile the desktop shell
        run: scripts/ci/report.sh cargo check -p cordial-app

  ui:
    name: UI (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm --prefix ui ci
      - name: Typecheck
        run: scripts/ci/report.sh npm --prefix ui run typecheck
      - name: Unit tests
        run: scripts/ci/report.sh npm --prefix ui run test
      - name: Build
        run: scripts/ci/report.sh npm --prefix ui run build

  inference-stack:
    name: Inference stack (llama.cpp + model reachability)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Hugging Face reachability (partial model fetch)
        run: |
          curl -fsSL -r 0-5242879 \
            "https://huggingface.co/LiquidAI/LFM3-VL-2B-GGUF/resolve/main/LFM3-VL-2B-Q4_K_M.gguf" \
            -o /tmp/model-head.bin
          test "$(stat -c%s /tmp/model-head.bin)" -gt 5000000
      - name: Fetch pinned llama.cpp source
        run: |
          curl -fsSL "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/refs/tags/${LLAMA_CPP_TAG}" \
            -o /tmp/llama.cpp.tar.gz
          echo "5496c675a36bcba53660a922f26cff75a8d24222d0554d337b450b552a30b502  /tmp/llama.cpp.tar.gz" | sha256sum -c -
          mkdir -p /tmp/llama-src && tar xzf /tmp/llama.cpp.tar.gz -C /tmp/llama-src
      - name: Build llama.cpp (static, mtmd only)
        run: |
          cmake -S /tmp/llama-src/llama.cpp-${LLAMA_CPP_TAG} -B /tmp/llama-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_MTMD=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build /tmp/llama-build --config Release --parallel
      - name: Verify static libraries exist
        run: |
          find /tmp/llama-build -name "libmtmd.a" -o -name "libllama.a" -o -name "libggml-base.a" | sort
          find /tmp/llama-build -name "libmtmd.a" | grep -q .
          find /tmp/llama-build -name "libllama.a" | grep -q .
