name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the behaviour suite against the real model (~20 min, 1.3 GB)"
        type: boolean
        default: false

# Instabox supplies a fresh Ubuntu 24.04 x64 VM per job. Never execute a
# fork PR on it: only repository pushes, trusted dispatches, and same-repository
# PRs are eligible. Review fork changes before pushing a trusted test branch.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # Pinned llama.cpp release (LFM3-VL support requires >= b11960).
  LLAMA_CPP_TAG: b12020

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Formatting is applied by .github/workflows/format.yml rather than gated
  # here, so a contributor without a local rustfmt of the matching toolchain is
  # not blocked by whitespace.

  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Rust (clippy, tests)
    runs-on: instabox-medium
    timeout-minutes: 120
    env:
      # instabox-medium has four cores and 8 GiB RAM. Bound both build systems
      # explicitly rather than letting nested Cargo/CMake builds oversubscribe it.
      CARGO_BUILD_JOBS: "4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cordial-rust
          cache-on-failure: true
      - name: Clippy (harness)
        run: scripts/ci/report.sh cargo clippy --workspace --exclude cordial-app --all-targets -- -W clippy::all
      - name: Tests (harness)
        run: scripts/ci/report.sh cargo test --workspace --exclude cordial-app --all-targets

  app:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Desktop shell (compile check)
    runs-on: instabox-medium
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cordial-app
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the frontend
        run: npm --prefix ui ci && npm --prefix ui run build
      - name: Test the desktop shell
        run: scripts/ci/report.sh cargo test -p cordial-app

  ui:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: UI (typecheck, tests, build)
    runs-on: instabox-medium
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm --prefix ui ci
      - name: Typecheck
        run: scripts/ci/report.sh npm --prefix ui run typecheck
      - name: Unit tests
        run: scripts/ci/report.sh npm --prefix ui run test
      - name: Build
        run: scripts/ci/report.sh npm --prefix ui run build

  inference-stack:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Inference stack (llama.cpp + model reachability)
    runs-on: instabox-medium
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Hugging Face reachability (partial model fetch)
        run: |
          curl -fsSL -r 0-5242879 \
            "https://huggingface.co/LiquidAI/LFM3-VL-2B-GGUF/resolve/main/LFM3-VL-2B-Q4_K_M.gguf" \
            -o /tmp/model-head.bin
          test "$(stat -c%s /tmp/model-head.bin)" -gt 5000000
      - name: Fetch pinned llama.cpp source
        run: |
          curl -fsSL "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/refs/tags/${LLAMA_CPP_TAG}" \
            -o /tmp/llama.cpp.tar.gz
          echo "5496c675a36bcba53660a922f26cff75a8d24222d0554d337b450b552a30b502  /tmp/llama.cpp.tar.gz" | sha256sum -c -
          mkdir -p /tmp/llama-src && tar xzf /tmp/llama.cpp.tar.gz -C /tmp/llama-src
      - name: Build llama.cpp (static, mtmd only)
        run: |
          cmake -S /tmp/llama-src/llama.cpp-${LLAMA_CPP_TAG} -B /tmp/llama-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_MTMD=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build /tmp/llama-build --config Release --parallel 4
      - name: Verify static libraries exist
        run: |
          find /tmp/llama-build -name "libmtmd.a" -o -name "libllama.a" -o -name "libggml-base.a" | sort
          find /tmp/llama-build -name "libmtmd.a" | grep -q .
          find /tmp/llama-build -name "libllama.a" | grep -q .
  live-model:
    name: Behaviour suite (real LFM3-VL-2B)
    permissions:
      contents: write
    # Same job as .github/workflows/live.yml. Reachable from a branch two ways:
    # a manual dispatch with `live: true`, or a commit that asks for it with
    # `[live]` in the message (GitHub only lists workflows that exist on the
    # default branch, and dispatch needs actions:write).
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      ((github.event_name == 'workflow_dispatch' && inputs.live) ||
      contains(github.event.head_commit.message, '[live]'))
    runs-on: instabox-medium
    timeout-minutes: 120
    env:
      CORDIAL_PORTABLE_CPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cordial-rust
      - uses: actions/cache@v4
        id: weights
        with:
          path: ${{ runner.temp }}/cordial-models
          key: lfm3-vl-2b-q4km-mmproj-q8
      - name: Test independent artifact verifier
        run: python3 scripts/ci/test_verify_task_artifacts.py
      - name: Generated task evaluation
        env:
          CORDIAL_MODEL_DIR: ${{ runner.temp }}/cordial-models
        run: |
          set -o pipefail
          cargo test -p cordial-core --test live_model -- --ignored --nocapture --test-threads=1 \
            --exact generated_complex_tasks_verify_artifacts 2>&1 | tee /tmp/task-eval.log
      - name: Publish task evaluation diagnostics
        if: always()
        run: python3 scripts/ci/task_eval_diagnostics.py /tmp/task-eval.log
      - name: Upload task evaluation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-task-evaluation
          path: /tmp/task-eval.log
          if-no-files-found: ignore
      - name: Load check (one question)
        env:
          CORDIAL_MODEL_DIR: ${{ runner.temp }}/cordial-models
        run: |
          set -o pipefail
          cargo test -p cordial-core --test live_model -- --ignored --nocapture --test-threads=1 \
            --exact answers_a_plain_factual_question_briefly 2>&1 | tee -a /tmp/live.log
      - name: Full suite
        env:
          CORDIAL_MODEL_DIR: ${{ runner.temp }}/cordial-models
        run: |
          set -o pipefail
          cargo test -p cordial-core --test live_model -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee /tmp/live.log
      - name: Publish the transcript
        if: always()
        run: |
          # Job logs are not always downloadable, so the interesting part of the
          # run is republished as annotations and committed as a transcript.
          log=/tmp/live.log
          if [ -f "$log" ]; then
            echo "==== questions and answers ===="
            # The Q/A blocks and the assertion, so a failure is readable without
            # the job log.
            grep -E "^--- |^\(|^  · |^> |^cordial: |invalid token|failed to initialize|inconsistent|MODEL BOOT FAILED|MODEL LOAD FAILED|panicked at|assertion|left:|right:|test result" "$log" \
              | grep -v "llama_model_loader" \
              | head -30 \
              | while IFS= read -r line; do
                  printf '::notice::%s\n' "$(printf '%s' "$line" | sed -e 's/%/%25/g')"
                done
          fi
          python3 scripts/ci/live_report.py /tmp/live.log docs/live-report.md || true
      - name: Upload live transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-model-transcript
          path: docs/live-report.md
          if-no-files-found: ignore
