    :root {
      --paper: #f4f3eb;
      --ink: #21352e;
      --muted: #626c62;
      --line: #c5cabe;
      --blue: #344bc5;
      --coral: #f58b6b;
      --mint: #b9d9c1;
      --sky: #bed0e8;
      --yellow: #f0e39c;
      --note: #fffdf3;
      --hover: #e7e9df;
      color-scheme: light;
      font-family: "Schibsted Grotesk", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background: var(--paper);
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; -webkit-tap-highlight-color: transparent; }
    svg { display: block; }
    button, a { touch-action: manipulation; }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 6px; }
    ::selection { background: var(--mint); color: var(--ink); }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .shell { width: min(1280px, calc(100% - 112px)); margin-inline: auto; }
    .header {
      min-height: 116px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: inline-flex;
      border-radius: 4px;
      text-decoration: none;
    }
    .brand svg { width: 174px; height: 46px; }
    .header__end { display: flex; align-items: center; gap: 23px; }
    .local-mark { width: 31px; height: 31px; color: var(--muted); }
    .github {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      transition: background .18s ease, border-color .18s ease;
    }
    .github:hover { background: var(--mint); border-color: var(--ink); }
    .github svg { width: 19px; height: 19px; }
    main { flex: 1; display: flex; align-items: center; }
    .hero {
      display: grid;
      grid-template-columns: 1fr 1.08fr;
      align-items: center;
      gap: 24px;
      padding-block: 42px 98px;
    }
    .intro { position: relative; z-index: 1; padding-bottom: 4px; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 29px;
      color: var(--muted);
      font-family: "Martian Mono", Consolas, monospace;
      font-size: 10px;
      letter-spacing: .015em;
    }
    .eyebrow svg { width: 15px; height: 15px; }
    h1 {
      margin: 0 0 38px;
      font-size: clamp(58px, 6.2vw, 88px);
      font-weight: 600;
      line-height: .99;
      letter-spacing: -.067em;
    }
    h1 span { display: block; }
    h1 .last-line { position: relative; width: fit-content; }
    .headline-flower {
      position: absolute;
      width: 48px;
      height: 48px;
      right: -65px;
      bottom: 8px;
      color: var(--coral);
      transform: rotate(12deg);
    }
    .downloads {
      display: flex;
      align-items: stretch;
      gap: 9px;
      max-width: 510px;
    }
    .download {
      position: relative;
      min-width: 0;
      flex: 1 1 0;
      min-height: 65px;
      padding: 15px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid var(--ink);
      border-radius: 5px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }
    .download:hover { background: var(--mint); transform: translateY(-3px); }
    .download:active { transform: translateY(0); }
    .download[data-current="true"] { background: var(--ink); color: var(--paper); --os-cutout: var(--ink); }
    .download[data-current="true"]:hover { background: #354d40; }
    .os-icon { width: 20px; height: 20px; flex: 0 0 auto; }
    .download__arrow {
      width: 14px;
      height: 14px;
      margin-left: auto;
      opacity: .65;
      flex: 0 0 auto;
      transition: transform .18s ease;
    }
    .download:hover .download__arrow { transform: translateY(3px); opacity: 1; }
    .release {
      margin: 17px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 20px;
      font-family: "Martian Mono", Consolas, monospace;
      font-size: 9px;
      color: var(--muted);
      text-decoration: none;
      width: fit-content;
      border-radius: 2px;
    }
    .release:hover { color: var(--ink); }
    .release__dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
    .release__arrow { width: 11px; height: 11px; }
    .art {
      position: relative;
      width: 100%;
      aspect-ratio: 1.04;
      isolation: isolate;
    }
    .artwork { width: 100%; height: 100%; overflow: visible; }
    .orbit { transform-origin: 320px 307px; animation: orbit 100s linear infinite; }
    .satellite { animation: float 7s ease-in-out infinite; }
    .satellite--two { animation-delay: -3.5s; }
    .signal { animation: signal 3s ease-in-out infinite; }
    .signal:nth-child(2) { animation-delay: .2s; }
    .signal:nth-child(3) { animation-delay: .4s; }
    .art:hover .orbit { animation-play-state: paused; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes signal { 0%, 70%, 100% { opacity: .35; } 35% { opacity: 1; } }
    .footer {
      min-height: 82px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .footer__signature { display: flex; align-items: center; gap: 11px; }
    .footer__signature svg { width: 17px; height: 19px; }
    .footer__line { width: 42px; height: 1px; background: var(--line); }
    .footer__symbols { display: flex; align-items: center; gap: 22px; color: var(--muted); }
    .footer__symbols svg { width: 17px; height: 17px; }
    .palette { display: flex; gap: 4px; }

    .palette i:nth-child(4) { background: var(--coral); }

      h1 { font-size: 66px; }
      .download { padding-inline: 12px; gap: 8px; }

      .hero { grid-template-columns: 1fr; gap: 14px; padding-block: 36px 37px; }

  <script>
    (() => {
      "use strict";

      const repo = "Katsugachi/Cordial";
      const api = "https://api.github.com/repos/" + repo + "/releases?per_page=20";
      const releaseBase = "https://github.com/" + repo + "/releases";
      const fallbackTag = "v0.1.0-preview-10";
      const fallbackFiles = {
        windows: { arm64: "Cordial_0.1.0_arm64-setup.exe", x64: "Cordial_0.1.0_x64-setup.exe" },
        macos: { arm64: "Cordial_0.1.0_aarch64.dmg", x64: "Cordial_0.1.0_x64.dmg" },
        linux: { arm64: "Cordial_0.1.0_aarch64.AppImage", x64: "Cordial_0.1.0_amd64.AppImage" }
      };
      const links = Object.fromEntries(
        Array.from(document.querySelectorAll("[data-os]"), (link) => [link.dataset.os, link])
      );
      const names = { windows: "Windows", macos: "macOS", linux: "Linux" };
      const architectures = { arm64: "ARM64", x64: "x64" };
      const patterns = {
        windows: { arm64: /_arm64-setup\.exe$/i, x64: /_x64-setup\.exe$/i },
        macos: { arm64: /_(?:aarch64|arm64)\.dmg$/i, x64: /_(?:x64|x86_64|amd64)\.dmg$/i },
        linux: { arm64: /_(?:aarch64|arm64)\.AppImage$/i, x64: /_(?:x64|x86_64|amd64)\.AppImage$/i }
      };
      const query = new URLSearchParams(location.search);
      const normalizeArch = (value) => {
        if (/^(arm64|aarch64|armv8|arm)$/i.test(value || "")) return "arm64";
        if (/^(x64|x86_64|amd64|x86|i[3-6]86)$/i.test(value || "")) return "x64";
        return "";
      };
      const normalizeOS = (value) => {
        if (/windows|win32|win64/i.test(value || "")) return "windows";
        if (/mac|darwin/i.test(value || "")) return "macos";
        if (/linux/i.test(value || "")) return "linux";
        return "";
      };
      const ua = navigator.userAgent || "";
      const platform = navigator.userAgentData?.platform || navigator.platform || "";
      // iPadOS can advertise a Mac desktop UA, but cannot run these installers.
      const touchMac = /Mac/i.test(platform) && navigator.maxTouchPoints > 1;
      const mobile = /Android|iPhone|iPad|iPod|CrOS/i.test(ua + " " + platform);
      const detectedOS = touchMac || mobile ? "" : normalizeOS(platform) || normalizeOS(ua);
      let architecture = normalizeArch(query.get("arch"));
      let currentRelease = null;

      function safeDownloadURL(value, tag) {
        try {
          const url = new URL(value);
          if (url.protocol !== "https:" || url.hostname !== "github.com" || url.username || url.password) return "";
          if (!url.pathname.startsWith("/" + repo + "/releases/download/" + tag + "/")) return "";
          return url.href;
        } catch { return ""; }
      }

      function applyRelease(release) {
        if (!release || release.draft || !Array.isArray(release.assets)) return false;
        const tag = String(release.tag_name || "");
        if (!/^v\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/.test(tag)) return false;
        const assets = release.assets.filter((asset) => asset.state === "uploaded" && safeDownloadURL(asset.browser_download_url, tag));
        // Never send visitors to a newer release whose platform upload is incomplete.
        const complete = Object.entries(patterns).every(([os, variants]) =>
          Object.values(variants).every((pattern) => assets.some((asset) => pattern.test(asset.name)))
        );
        if (!complete) return false;
        currentRelease = { tag, assets, prerelease: Boolean(release.prerelease) };
        for (const [os, link] of Object.entries(links)) link.href = releaseBase + "/tag/" + tag;
        const label = tag.replace(/^v/, "").replace(/^0\.1\.0-preview-(\d+)$/, "Preview $1");
        document.getElementById("release-version").textContent = label;
        const releaseLink = document.getElementById("release-link");
        releaseLink.href = releaseBase + "/tag/" + tag;
        releaseLink.setAttribute("aria-label", label + " release notes");
        updateLinks();
        return true;
      }

      function updateLinks() {
        for (const [os, link] of Object.entries(links)) {
          const arch = architecture || (os === "macos" ? "arm64" : "x64");
          // Complete, embedded links also work offline or when the API is rate-limited.
          let url = releaseBase + "/download/" + fallbackTag + "/" + fallbackFiles[os][arch];
          if (currentRelease) {
            const asset = currentRelease.assets.find((candidate) => patterns[os][arch].test(candidate.name));
            if (asset) url = safeDownloadURL(asset.browser_download_url, currentRelease.tag);
          }
          link.href = url;
          link.dataset.architecture = arch;
          link.dataset.current = String(detectedOS === os);
          const description = "Download Cordial for " + names[os] + " (" + architectures[arch] + ")";
          link.setAttribute("aria-label", description);
          link.title = description;
        }
      }

      // WebGL is only a fallback hint. Never use it to override explicit client hints.
      function graphicsArchitecture() {
        try {
          const canvas = document.createElement("canvas");
          const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
          if (!gl) return "";
          const extension = gl.getExtension("WEBGL_debug_renderer_info");
          const renderer = extension ? String(gl.getParameter(extension.UNMASKED_RENDERER_WEBGL)) : "";
          gl.getExtension("WEBGL_lose_context")?.loseContext();
          if (/Apple M\d|Apple A\d/i.test(renderer)) return "arm64";
          if (/Intel|AMD|Radeon|NVIDIA|GeForce/i.test(renderer)) return "x64";
          return "";
        } catch { return ""; }
      }

      async function detectArchitecture() {
        const explicitArchitecture = architecture;
        // Windows on ARM often exposes an x64 UA for compatibility. High-entropy
        // client hints are more accurate, so consult them before the UA string.
        if (!explicitArchitecture && navigator.userAgentData?.getHighEntropyValues) {
          try {
            const hints = await navigator.userAgentData.getHighEntropyValues(["architecture", "bitness"]);
            if (!architecture) architecture = normalizeArch(hints.architecture);
          } catch { /* Privacy settings may decline high-entropy hints. */ }
        }
        const uaArch = normalizeArch((ua.match(/(?:arm64|aarch64|x86_64|amd64|Win64|WOW64|x64)/i) || [])[0]);
        if (!architecture) architecture = uaArch;
        // Safari hides Apple silicon in the Mac UA. Use a renderer hint when
        // available, otherwise default to Apple silicon. ?arch=x64 is an explicit
        // override for Intel Macs whose browser does not expose architecture.
        if (!architecture && !explicitArchitecture && detectedOS === "macos") architecture = graphicsArchitecture();
        updateLinks();
      }

      async function refreshRelease() {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 6000);
        try {
          const response = await fetch(api, {
            signal: controller.signal,
            credentials: "omit",
            headers: { Accept: "application/vnd.github+json" }
          });
          if (!response.ok) return;
          const releases = await response.json();
          if (!Array.isArray(releases)) return;
          const newest = releases
            .filter((release) => !release.draft && release.published_at)
            .sort((a, b) => Date.parse(b.published_at) - Date.parse(a.published_at))
            .find((release) => applyRelease(release));
          void newest;
        } catch { /* Keep the working, embedded release links when offline. */ }
        finally { clearTimeout(timeout); }
      }

      updateLinks();
      void detectArchitecture();
      void refreshRelease();
    })();
