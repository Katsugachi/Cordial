[workspace]
resolver = "2"
members = [
    "crates/cordial-core",
    "crates/cordial-llama",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Katsugachi/Cordial"
rust-version = "1.83"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "5"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "stream",
    "json",
] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "io-util",
] }
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"

# llama.cpp is C++; keep its translation units optimised even in dev builds so
# `cargo run` is usable.
[profile.dev.package."*"]
opt-level = 2
